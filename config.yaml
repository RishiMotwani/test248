system:
  seed: 42
  ollama_endpoint: http://localhost:11434
  llm_model: llama3.1:8b
  embedding_model: nomic-embed-text

  # Hard cap on the context actually supplied to the LLM.
  max_context_tokens: 4096

  # 0 means: use max_context_tokens as the active injection limit.
  injection_token_limit: 0

  # Independent long-term memory capacity.
  # 0 means: no hard store-token cap; retention is governed by
  # compression + decay. This prototype keeps memory in RAM.
  memory_store_token_budget: 0
decay_lambdas:
  transient: 0.15
  personal: 0.005
  technical_preference: 0.02
  project_context: 0.01
scoring_weights:
  w1_relevance: 0.4
  w2_utility: 0.3
  w3_recency: 0.15
  w4_frequency: 0.15
pruning:
  threshold: 0.2

# Retention policy (D32): separates dynamic activation (current_importance,
# retrieval ranking) from long-term survival (retention_priority, eviction).
#   hard_threshold  -> legacy behavior: prune below pruning.threshold
#   soft_decay      -> importance decays, no threshold deletion; store survives
#                      unless the store-token budget actually evicts
#   dual_score      -> soft_decay + store-budget eviction uses retention_priority
# Default (Phase 11, E15): dual_score. Decay no longer deletes; store eviction
# prefers low retention_priority facts.
retention:
  mode: dual_score
  eviction_priority: retention_priority
retrieval:
  top_k: 5
  similarity_threshold: 0.35
compression:
  enabled: true
vram:
  bytes_per_token_estimate:
    llama: 131072
    qwen2: 57344
    gemma4: 98304
    default: 100000
